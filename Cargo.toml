[package]
name = "cliptether"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
async-channel = "2.5.0"
bytes = "1.12.1"
chacha20poly1305 = "0.10.1"
clipboard-master = "4.1.0"
directories = "6.0.0"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
spiderweb-async = "0.1.2"
tokio = { version = "1.54.1", features = ["macros", "fs"] }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.5"
x11-clipboard = "0.9.3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.0"
objc2-app-kit = { version = "0.3.0", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.0", features = ["NSArray", "NSData", "NSString", "NSURL"] }
